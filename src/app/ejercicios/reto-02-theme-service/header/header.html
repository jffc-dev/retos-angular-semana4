<header class="flex items-center justify-between px-6 py-4 text-slate-900">
  <span
    class="font-semibold"
    [class.text-white]="themeService.tema() === 'dark'"
    [class.text-slate-900]="themeService.tema() === 'light'"
  >Header</span>

  <button
    type="button"
    class="rounded-full bg-slate-200 px-4 py-1.5 text-sm font-medium"
    (click)="themeService.toggleTema()"
  >
    🌙 Modo oscuro
  </button>
</header>
