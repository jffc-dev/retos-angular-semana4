<div class="rounded-xl border border-emerald-200 bg-emerald-50 p-6 text-center">
  <h3 class="text-xs font-semibold uppercase tracking-wide text-emerald-600">Componente B</h3>
  <p class="mt-3 text-5xl font-bold text-emerald-900">{{ counterService.contador() }}</p>

  <div class="mt-5 flex justify-center gap-2">
    <button
      type="button"
      (click)="counterService.increment();"
      class="h-9 w-9 rounded-full bg-emerald-200 font-bold text-emerald-800 hover:bg-emerald-300"
    >
      +
    </button>
    <button
      type="button"
      (click)="counterService.reset()"
      class="rounded-full bg-emerald-600 px-4 text-sm font-medium text-white hover:bg-emerald-700"
    >
      Reset
    </button>
    <button
      type="button"
      (click)="counterService.decrement()"
      class="h-9 w-9 rounded-full bg-emerald-200 font-bold text-emerald-800 hover:bg-emerald-300"
    >
      −
    </button>
  </div>
</div>
