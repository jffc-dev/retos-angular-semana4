<div class="rounded-xl border border-blue-200 bg-blue-50 p-6 text-center">
  <h3 class="text-xs font-semibold uppercase tracking-wide text-blue-600">Componente A</h3>
  <p class="mt-3 text-5xl font-bold text-blue-900">{{ counterService.contador() }}</p>

  <div class="mt-5 flex justify-center gap-2">
    <button
      type="button"
      (click)="counterService.decrement()"
      class="h-9 w-9 rounded-full bg-blue-200 font-bold text-blue-800 hover:bg-blue-300"
    >
      −
    </button>
    <button
      type="button"
      (click)="counterService.reset()"
      class="rounded-full bg-blue-600 px-4 text-sm font-medium text-white hover:bg-blue-700"
    >
      Reset
    </button>
    <button
      type="button"
      (click)="counterService.increment()"
      class="h-9 w-9 rounded-full bg-blue-200 font-bold text-blue-800 hover:bg-blue-300"
    >
      +
    </button>
  </div>
</div>
